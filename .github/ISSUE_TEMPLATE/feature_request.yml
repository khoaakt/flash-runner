name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
