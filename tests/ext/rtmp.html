<!doctype html><html><head><meta charset="utf-8"><title>rtmp</title></head>
<body style="margin:8px">
<!-- ?host=<address of the RTMP server> (default 127.0.0.1); the stream is "test" in the application "stream" (see docs/STATUS.md for how it is served) -->
<script>
  var host = new URLSearchParams(location.search).get('host') || '127.0.0.1';
  document.write('<embed src="/tests/swf/rtmp.swf" type="application/x-shockwave-flash" width="500" height="420" flashvars="url=rtmp://' + host + '/stream&amp;stream=test">');
</script>
</body></html>
